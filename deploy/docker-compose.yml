# Run from the repository root:
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  pocketbase:
    build:
      context: ..
      dockerfile: deploy/pocketbase.Dockerfile
    restart: unless-stopped
    volumes:
      - ./data/pb_data:/pb/pb_data

  service:
    build:
      context: ..
      dockerfile: deploy/service.Dockerfile
    restart: unless-stopped
    env_file:
      - ../service/.env
    environment:
      # These override service/.env, which is written for local development.
      POCKETBASE_URL: http://pocketbase:8090
      HOST: 0.0.0.0
      PORT: "8787"
    depends_on:
      - pocketbase

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports:
      # Only reachable from the VM itself. `tailscale serve` provides HTTPS and Tailscale-only access.
      - "127.0.0.1:8080:80"
    depends_on:
      - pocketbase
      - service
